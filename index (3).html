<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d2330">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>secwatch</title>
<style>
:root{
  --bg:#f5f5f7;--card:#fff;--fg:#1b1f29;--mut:#6b7280;--line:#e6e7eb;--chip:#eef0f3;--acc:#f97316;--accbg:#fff1e6;
  --top:#1d2330;--crit:#c42b2b;--high:#e05a1a;--med:#c08a00;--low:#2f855a;--none:#8a919c;--kev:#7c3aed;--unread:#d93025;
  --bub:#fff;--sel:#e8eefc;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1116;--card:#171b22;--fg:#e8eaee;--mut:#9aa3b2;--line:#252a34;--chip:#222833;--accbg:#3a2412;--bub:#1c212a;--sel:#1e2a44}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:15px/1.55 -apple-system,"Hiragino Sans","Noto Sans JP",Roboto,sans-serif;overscroll-behavior-y:contain}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc)}
.bar{position:sticky;top:0;z-index:5;background:var(--top);color:#fff;
  padding:calc(env(safe-area-inset-top) + 8px) 8px 8px;display:flex;align-items:center;gap:6px;min-height:56px}
.bar h1{font-size:18px;margin:0 0 0 8px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar h1 small{display:block;font-size:11px;font-weight:400;opacity:.7}
.ib{background:transparent;border:0;color:#fff;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.ib:active{background:rgba(255,255,255,.15)}
.ib svg{width:22px;height:22px}
.spin svg{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.searchbar{display:none;padding:8px 12px;background:var(--top)}
.searchbar.on{display:block}
.searchbar input{width:100%;border:0;border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.12);color:#fff}
.searchbar input::placeholder{color:rgba(255,255,255,.6)}
.banner{margin:8px 12px 0;background:var(--accbg);color:var(--fg);border-radius:10px;padding:8px 12px;font-size:13px}
/* チャンネル一覧 */
.chlist{background:var(--card)}
.ch{display:flex;gap:12px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.ch:active{background:var(--sel)}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;letter-spacing:.02em}
.av.sm{width:34px;height:34px;font-size:12px}
.chb{flex:1;min-width:0}
.chr1{display:flex;align-items:baseline;gap:8px}
.chn{font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cht{font-size:12px;color:var(--mut);flex:none}
.chr2{display:flex;align-items:center;gap:8px;margin-top:1px}
.chp{flex:1;min-width:0;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch.unread .chp{color:var(--fg);font-weight:600}
.badge{flex:none;background:var(--unread);color:#fff;font-size:11px;font-weight:700;border-radius:999px;min-width:20px;height:20px;padding:0 6px;display:grid;place-items:center}
.sec{font-size:12px;color:var(--mut);padding:14px 14px 6px;font-weight:600}
/* タイムライン */
.tl{padding:8px 10px 24px;display:flex;flex-direction:column;gap:10px}
.day{align-self:center;font-size:12px;color:var(--mut);background:var(--chip);border-radius:999px;padding:2px 12px;margin:8px 0 2px}
.msg{display:flex;gap:8px;align-items:flex-start}
.bub{flex:1;min-width:0;background:var(--bub);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 12px;text-align:left;width:100%;position:relative}
.bub:active{background:var(--sel)}
.bub.unread::after{content:"";position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--unread)}
.bm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mut);padding-right:14px}
.bh{font-weight:700;margin-top:4px;word-break:break-word}
.bs{font-size:13px;color:var(--mut);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:0 7px;font-size:12px;font-weight:700;color:#fff;line-height:20px}
.p-CRITICAL{background:var(--crit)}.p-HIGH{background:var(--high)}.p-MEDIUM{background:var(--med)}.p-LOW{background:var(--low)}.p-,.p-NONE,.p-INFORMATIONAL{background:var(--none)}
.kev{background:var(--kev);color:#fff;border-radius:6px;padding:0 7px;font-size:11px;font-weight:700;line-height:20px}
.st{border-radius:6px;padding:0 7px;font-size:11px;line-height:20px;background:var(--chip);color:var(--mut)}
.st-確認中{background:#fef3c7;color:#92400e}.st-対応中{background:#ffe4d5;color:#9a3412}.st-対応済{background:#dcfce7;color:#166534}
@media (prefers-color-scheme:dark){.st-確認中{background:#5b4210;color:#fde68a}.st-対応中{background:#6b2d10;color:#fed7aa}.st-対応済{background:#14532d;color:#bbf7d0}}
.more{align-self:center;border:0;background:var(--chip);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:48px 16px}
/* 詳細 */
.dt{padding:14px 14px 40px}
.dhead{display:flex;gap:10px;align-items:center}
.dhead .who{font-weight:700}.dhead .id{font-size:12px;color:var(--mut)}
.dtitle{font-size:19px;font-weight:800;line-height:1.45;margin:12px 0 4px;word-break:break-word}
.score{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:14px 0}
.sbox{flex:none;width:62px;height:62px;border-radius:14px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:22px}
.sbox small{font-size:10px;font-weight:700;opacity:.9}
.sinfo{font-size:13px;color:var(--mut);min-width:0}
.sinfo b{color:var(--fg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin:10px 0}
.item{padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item h3{margin:0 0 3px;font-size:12px;color:var(--mut);font-weight:700;display:flex;gap:6px;align-items:center}
.item p{margin:0;white-space:pre-wrap;word-break:break-word}
.item ul{margin:0;padding-left:18px}
.btn{display:block;width:100%;text-align:center;border:0;border-radius:12px;padding:12px;font-weight:700;background:var(--acc);color:#fff;text-decoration:none;margin:12px 0}
.btn.sub{background:var(--chip);color:var(--fg)}
.cves{display:flex;flex-wrap:wrap;gap:6px}
.cves a{font-size:12px;background:var(--chip);color:var(--fg);border-radius:6px;padding:2px 8px;text-decoration:none}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:8px 0}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 0;font-size:12px}
.seg button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
textarea{width:100%;min-height:72px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card);resize:vertical}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:var(--fg);color:var(--bg);
  padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;z-index:20;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.set{padding:12px}
.set .card{padding:12px 14px}
.set h2{font-size:14px;margin:0 0 8px}
.set p{margin:4px 0;font-size:13px;color:var(--mut)}
.row{display:flex;gap:8px}.row .btn{margin:6px 0}
/* タブ・ベンダー別 */
.tabs{display:flex;background:var(--top);padding:0 8px;gap:4px;position:sticky;top:56px;z-index:4}
.tab{flex:1;border:0;background:none;color:rgba(255,255,255,.65);padding:10px 0 9px;font-weight:700;font-size:14px;border-bottom:3px solid transparent}
.tab.on{color:#fff;border-bottom-color:var(--acc)}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 12px;overflow:hidden}
.vhead{display:flex;gap:10px;align-items:center;padding:12px 14px 8px}
.vname{font-weight:800;font-size:16px;flex:1}
.vstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 14px 10px}
.vs{background:var(--bg);border-radius:10px;padding:6px 4px;text-align:center}
.vs b{display:block;font-size:18px;line-height:1.2;font-variant-numeric:tabular-nums}
.vs span{font-size:10px;color:var(--mut)}
.vrow{display:flex;gap:8px;align-items:center;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:9px 14px;text-align:left}
.vrow:active{background:var(--sel)}
.vrow .t{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vrow.unread .t{font-weight:700}
.vrow .dd{font-size:11px;color:var(--mut);flex:none}
.vall{display:block;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:10px;color:var(--acc);font-weight:700;font-size:13px}
.fchips{display:flex;gap:6px;padding:8px 12px 0;position:sticky;top:56px;z-index:4;background:var(--bg)}
.fchip{border:0;background:var(--chip);border-radius:999px;padding:6px 12px;font-size:13px}
.fchip.on{background:var(--fg);color:var(--bg)}
.orig{font-size:13px;color:var(--mut);word-break:break-word;margin-top:2px}
.trbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.trbar h3{margin:0}
.lnk{border:0;background:none;color:var(--acc);font-size:12px;font-weight:700;padding:2px 0}
.trnote{font-size:11px;color:var(--mut);margin-top:6px}
.src{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid var(--line)}
.src:last-child{border:0}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
/* ---------- 定数 ---------- */
const VENDORS = {
  PaloAlto: { name: "Palo Alto", short: "PA", color: "#e8562a" },
  Fortinet: { name: "Fortinet",  short: "FT", color: "#d62f2f" },
  Cisco:    { name: "Cisco",     short: "CS", color: "#0a8fc9" },
  Arista:   { name: "Arista",    short: "AR", color: "#2b4c8c" },
  Juniper:  { name: "Juniper",   short: "JN", color: "#2f8a4f" },
};
const STATUSES = ["未確認", "確認中", "対応中", "対応済", "影響なし"];
const OPEN = ["未確認", "確認中", "対応中"];
const ICON = {
  back: '<path d="M15 18l-6-6 6-6"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  reload: '<path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  check: '<path d="M20 6L9 17l-5-5"/>',
};

/* ---------- ローカル保存（状態・メモ・既読はこの端末だけに保存） ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("sw." + k); return v === null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem("sw." + k, JSON.stringify(v)); } catch (_) {} },
};
let READ = store.get("read", {});
let MINE = store.get("mine", {});   // uid -> {s: 状態, m: メモ, t: 更新日時}
let DATA = { advisories: [], runs: [], generated: "" };
let BY_UID = {};
let loading = false, loadError = "", searchQ = "";

/* ---------- ユーティリティ ---------- */
const $ = (s, r = document) => r.querySelector(s);
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;            // 固定のSVGアイコンにだけ使う
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) if (c !== null && c !== undefined && c !== false && c !== "") e.append(c.nodeType ? c : String(c));
  return e;
}
const svg = (name) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[name]}</svg>`;
function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("show"), 1600); }
const vinfo = (v) => VENDORS[v] || { name: v, short: (v || "?").slice(0, 2).toUpperCase(), color: "#667085" };
const dateOf = (a) => a.published || a.first_seen || "";
function sevOf(a) {
  if (a.severity) return a.severity.toUpperCase();
  const s = a.cvss; if (s == null) return "";
  return s >= 9 ? "CRITICAL" : s >= 7 ? "HIGH" : s >= 4 ? "MEDIUM" : s > 0 ? "LOW" : "NONE";
}
const isImportant = (a) => a.kev || (a.cvss != null ? a.cvss >= 7 : ["CRITICAL", "HIGH"].includes(sevOf(a)));
const statusOf = (a) => (MINE[a.uid] && MINE[a.uid].s) || "未確認";
const headline = (a) => (a.ja && a.ja.title) || a.title || a.adv_id;
const jaSummary = (a) => (a.ja && a.ja.summary) || "";
const ENGINE = { deepl: "DeepL", argos: "Argos Translate" };
const gtUrl = (u) => "https://translate.google.com/translate?sl=auto&tl=ja&u=" + encodeURIComponent(u);
let homeTab = store.get("tab", "channels");
let chFilter = "all";
const safeUrl = (u) => /^https?:\/\//i.test(u || "") ? u : null;
const WD = ["日", "月", "火", "水", "木", "金", "土"];
function d(iso) { const x = new Date(iso); return isNaN(x) ? null : x; }
function shortDate(iso) {
  const x = d(iso); if (!x) return "";
  const now = new Date(), diff = (now - x) / 864e5;
  const dateOnly = /T00:00:00(\.0+)?Z$/.test(iso);  // 日付しか分からないもの（時刻を出すと誤解を招く）
  if (x.toDateString() === now.toDateString()) return dateOnly ? "今日" : `${x.getHours()}:${String(x.getMinutes()).padStart(2, "0")}`;
  if (diff < 6) return WD[x.getDay()] + "曜";
  return `${x.getMonth() + 1}/${x.getDate()}`;
}
function dayLabel(iso) { const x = d(iso); return x ? `${x.getFullYear()}年${x.getMonth() + 1}月${x.getDate()}日(${WD[x.getDay()]})` : "日付不明"; }
function fullDate(iso) { const x = d(iso); return x ? `${x.getFullYear()}/${x.getMonth() + 1}/${x.getDate()}` : "-"; }

/* ---------- データ ---------- */
async function load(manual) {
  if (loading) return;
  loading = true; render();
  try {
    const r = await fetch("../data/advisories.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    DATA = await r.json();
    loadError = r.headers.get("X-From-Cache") ? "オフラインのため、前回のデータを表示しています" : "";
    BY_UID = Object.fromEntries(DATA.advisories.map(a => [a.uid, a]));
    if (!store.get("init", false)) {  // 初回: 3日より前のものは既読にしておく
      const cut = new Date(Date.now() - 3 * 864e5).toISOString();
      for (const a of DATA.advisories) if (dateOf(a) < cut) READ[a.uid] = 1;
      store.set("read", READ); store.set("init", true);
    }
    if (manual) toast("更新しました");
  } catch (e) {
    loadError = "データを取得できませんでした（" + e.message + "）";
  } finally { loading = false; render(); }
}
function markRead(uids) { let ch = false; for (const u of uids) if (!READ[u]) { READ[u] = 1; ch = true; } if (ch) store.set("read", READ); }
function channels() {
  const all = DATA.advisories;
  const list = [{ id: "important", name: "重要（CVSS 7以上・KEV）", av: { short: "!", color: "#c42b2b" }, items: all.filter(isImportant) }];
  for (const v of Object.keys(VENDORS)) list.push({ id: v, name: VENDORS[v].name, av: VENDORS[v], items: all.filter(a => a.vendor === v) });
  for (const v of [...new Set(all.map(a => a.vendor))]) if (!VENDORS[v]) list.push({ id: v, name: v, av: vinfo(v), items: all.filter(a => a.vendor === v) });
  return list;
}
function channelById(id) {
  if (id === "open") return { id, name: "未完了の対応", av: { short: "✓", color: "#9a3412" }, items: DATA.advisories.filter(a => ["確認中", "対応中"].includes(statusOf(a))) };
  return channels().find(c => c.id === id);
}

/* ---------- ルーティング ---------- */
let navDepth = 0;
function go(hash) { navDepth++; location.hash = hash; }
function back() { if (navDepth > 0) { navDepth--; history.back(); } else { location.replace("#/"); } }
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
function route() { const h = location.hash.replace(/^#/, "") || "/"; const p = h.split("/").filter(Boolean); return { name: p[0] || "home", arg: p[1] ? decodeURIComponent(p.slice(1).join("/")) : "" }; }

/* ---------- 画面 ---------- */
function topbar(title, sub, { backBtn, actions } = {}) {
  return el("header", { class: "bar" },
    backBtn ? el("button", { class: "ib", "aria-label": "戻る", html: svg("back"), onclick: back }) : null,
    el("h1", {}, title, sub ? el("small", {}, sub) : null),
    actions || null);
}
function avatar(av, sm) { return el("div", { class: "av" + (sm ? " sm" : ""), style: `background:${av.color}` }, av.short); }
function pill(a) {
  const s = sevOf(a);
  return el("span", { class: "pill p-" + s }, a.cvss != null ? `CVSS ${Number(a.cvss).toFixed(1)}` : (s || "未評価"));
}
function lastUpdated() {
  const g = DATA.generated; if (!g) return loading ? "読み込み中…" : "";
  const bad = (DATA.runs || []).filter(r => !r.ok).map(r => vinfo(r.vendor).name);
  return "更新 " + shortDate(g) + (bad.length ? " ・ ⚠ " + bad.join(", ") : "");
}

function viewHome() {
  const root = el("div");
  const sb = el("div", { class: "searchbar" + (searchQ ? " on" : "") },
    el("input", { type: "search", placeholder: "製品名・CVE・IDで検索", value: searchQ,
      oninput: (e) => { searchQ = e.target.value; renderList(); } }));
  root.append(topbar("secwatch", lastUpdated(), { actions: [
    el("button", { class: "ib", "aria-label": "検索", html: svg("search"), onclick: () => { sb.classList.toggle("on"); if (sb.classList.contains("on")) $("input", sb).focus(); else { searchQ = ""; renderList(); } } }),
    el("button", { class: "ib" + (loading ? " spin" : ""), "aria-label": "更新", html: svg("reload"), onclick: () => load(true) }),
    el("button", { class: "ib", "aria-label": "設定", html: svg("gear"), onclick: () => go("#/settings") }),
  ] }), sb);
  const tabs = el("div", { class: "tabs" },
    [["channels", "チャンネル"], ["vendors", "ベンダー別"]].map(([k, label]) =>
      el("button", { class: "tab" + (homeTab === k ? " on" : ""), onclick: () => { homeTab = k; store.set("tab", k); render(); } }, label)));
  root.append(tabs);
  if (loadError) root.append(el("div", { class: "banner" }, loadError));
  const body = el("div");
  root.append(body);

  function renderList() {
    body.replaceChildren();
    if (searchQ.trim()) {
      const q = searchQ.trim().toLowerCase();
      const hits = DATA.advisories.filter(a => [a.adv_id, a.title, a.summary, headline(a), jaSummary(a), (a.cves || []).join(" "), a.vendor,
        (MINE[a.uid] && MINE[a.uid].m) || ""].join(" ").toLowerCase().includes(q)).slice(0, 100);
      body.append(el("div", { class: "sec" }, `検索結果 ${hits.length}件`));
      body.append(hits.length ? el("div", { class: "tl" }, hits.map(a => bubble(a, true))) : el("div", { class: "empty" }, "見つかりませんでした"));
      return;
    }
    if (homeTab === "vendors") { body.append(vendorOverview()); return; }
    const chs = channels();
    const open = DATA.advisories.filter(a => ["確認中", "対応中"].includes(statusOf(a)));
    body.append(el("div", { class: "sec" }, "チャンネル"));
    const list = el("div", { class: "chlist" });
    for (const c of chs) list.append(channelRow(c));
    body.append(list);
    if (open.length) {
      body.append(el("div", { class: "sec" }, "自分の対応"));
      body.append(el("div", { class: "chlist" }, channelRow(channelById("open"), true)));
    }
    if (!DATA.advisories.length && !loading) body.append(el("div", { class: "empty" }, "まだデータがありません。GitHub Actions の初回実行が終わるまでお待ちください。"));
  }
  renderList();
  return root;
}
function vendorOverview() {
  const wrap = el("div", { style: "padding-bottom:24px" });
  const cut30 = new Date(Date.now() - 30 * 864e5).toISOString();
  const vendors = [...Object.keys(VENDORS), ...new Set(DATA.advisories.map(a => a.vendor).filter(v => !VENDORS[v]))];
  wrap.append(el("div", { class: "sec" }, "直近30日の件数と、未完了の重要案件"));
  for (const vid of vendors) {
    const all = DATA.advisories.filter(a => a.vendor === vid).sort((x, y) => dateOf(y).localeCompare(dateOf(x)));
    const recent = all.filter(a => dateOf(a) >= cut30);
    const v = vinfo(vid);
    const openImp = all.filter(a => isImportant(a) && OPEN.includes(statusOf(a)));
    const unread = all.filter(a => !READ[a.uid]).length;
    const run = (DATA.runs || []).find(r => r.vendor === vid);
    const stat = (n, label, color) => el("div", { class: "vs" }, el("b", { style: n && color ? `color:${color}` : "" }, n), el("span", {}, label));
    // 未完了の重要案件を優先し、残りを新しい順で最大4件
    const top = [...openImp, ...all.filter(a => !openImp.includes(a))].slice(0, 4);
    wrap.append(el("div", { class: "vcard" },
      el("div", { class: "vhead" }, avatar(v, true), el("span", { class: "vname" }, v.name),
        run && !run.ok ? el("span", { class: "st", style: "background:#fee2e2;color:#991b1b" }, "取得失敗") : null,
        unread ? el("span", { class: "badge" }, unread > 99 ? "99+" : unread) : null),
      el("div", { class: "vstats" },
        stat(recent.length, "30日の件数"),
        stat(recent.filter(a => a.cvss >= 9).length, "CVSS 9+", "var(--crit)"),
        stat(recent.filter(a => a.kev).length, "KEV", "var(--kev)"),
        stat(openImp.length, "重要・未完了", "var(--high)")),
      top.map(a => el("button", { class: "vrow" + (READ[a.uid] ? "" : " unread"), onclick: () => go("#/a/" + encodeURIComponent(a.uid)) },
        pill(a), el("span", { class: "t" }, headline(a)), el("span", { class: "dd" }, shortDate(dateOf(a))))),
      all.length ? el("button", { class: "vall", onclick: () => go("#/c/" + encodeURIComponent(vid)) }, `すべて見る（${all.length}件）`)
        : el("div", { class: "vrow", style: "color:var(--mut);font-size:13px" }, "まだありません")));
  }
  return wrap;
}

function channelRow(c, noBadge) {
  const items = [...c.items].sort((x, y) => dateOf(y).localeCompare(dateOf(x)));
  const last = items[0];
  const unread = noBadge ? 0 : items.filter(a => !READ[a.uid]).length;
  return el("button", { class: "ch" + (unread ? " unread" : ""), onclick: () => go("#/c/" + encodeURIComponent(c.id)) },
    avatar(c.av),
    el("div", { class: "chb" },
      el("div", { class: "chr1" }, el("span", { class: "chn" }, c.name), el("span", { class: "cht" }, last ? shortDate(dateOf(last)) : "")),
      el("div", { class: "chr2" },
        el("span", { class: "chp" }, last ? (c.id === "important" || c.id === "open" ? vinfo(last.vendor).name + ": " : "") + headline(last) : "まだありません"),
        unread ? el("span", { class: "badge" }, unread > 99 ? "99+" : unread) : (noBadge ? el("span", { class: "badge", style: "background:var(--high)" }, items.length) : null))));
}

function bubble(a, showVendor) {
  const st = statusOf(a), v = vinfo(a.vendor);
  const sum = jaSummary(a) || (a.summary && !a.summary.toLowerCase().startsWith((a.title || "").toLowerCase().slice(0, 40)) ? a.summary : "");
  return el("div", { class: "msg" },
    showVendor ? avatar(v, true) : avatar(v, true),
    el("button", { class: "bub" + (READ[a.uid] ? "" : " unread"), onclick: () => go("#/a/" + encodeURIComponent(a.uid)) },
      el("div", { class: "bm" }, el("b", { style: "color:var(--fg)" }, v.name), a.adv_id, pill(a), a.kev ? el("span", { class: "kev" }, "悪用確認") : null,
        st !== "未確認" ? el("span", { class: "st st-" + st }, st) : null),
      el("div", { class: "bh" }, headline(a)),
      sum ? el("div", { class: "bs" }, sum) : null));
}

function viewChannel(id) {
  const c = channelById(id);
  if (!c) return el("div", {}, topbar("見つかりません", "", { backBtn: true }), el("div", { class: "empty" }, "チャンネルがありません"));
  const filters = { all: () => true, imp: isImportant, open: (a) => OPEN.includes(statusOf(a)) && isImportant(a) };
  const items = [...c.items].filter(filters[chFilter] || filters.all).sort((x, y) => dateOf(x).localeCompare(dateOf(y)));
  const unread = items.filter(a => !READ[a.uid]);
  const root = el("div");
  root.append(topbar(c.name, `${items.length}件${unread.length ? " ・ 未読 " + unread.length : ""}`, { backBtn: true, actions: [
    unread.length ? el("button", { class: "ib", "aria-label": "すべて既読", html: svg("check"),
      onclick: () => { markRead(items.map(a => a.uid)); toast("すべて既読にしました"); render(); } }) : null] }));
  if (c.id !== "important" && c.id !== "open") {
    root.append(el("div", { class: "fchips" },
      [["all", "すべて"], ["imp", "重要のみ"], ["open", "重要・未完了"]].map(([k, label]) =>
        el("button", { class: "fchip" + (chFilter === k ? " on" : ""), onclick: () => { chFilter = k; render(); } }, label))));
  }
  const tl = el("div", { class: "tl" });
  let shown = 60;
  const draw = () => {
    tl.replaceChildren();
    const slice = items.slice(Math.max(0, items.length - shown));
    if (items.length > shown) tl.append(el("button", { class: "more", onclick: () => { const h = document.body.scrollHeight; shown += 60; draw(); window.scrollTo(0, document.body.scrollHeight - h); } }, "さらに前を表示"));
    let lastDay = "";
    for (const a of slice) {
      const day = dayLabel(dateOf(a));
      if (day !== lastDay) { tl.append(el("div", { class: "day" }, day)); lastDay = day; }
      tl.append(bubble(a, c.id === "important" || c.id === "open"));
    }
    if (!items.length) tl.append(el("div", { class: "empty" }, chFilter === "all" ? "まだありません" : "該当するものはありません"));
  };
  draw();
  root.append(tl);
  requestAnimationFrame(() => window.scrollTo(0, document.body.scrollHeight));
  return root;
}

function section(title, content, cls) {
  if (content === null || content === undefined || content === "" || (Array.isArray(content) && !content.length)) return null;
  const body = Array.isArray(content) ? el("ul", {}, content.map(x => el("li", {}, x))) : el("p", {}, content);
  return el("div", { class: "item" + (cls ? " " + cls : "") }, el("h3", {}, title), body);
}

function viewDetail(uid) {
  const a = BY_UID[uid];
  if (!a) return el("div", {}, topbar("詳細", "", { backBtn: true }),
    el("div", { class: "empty" }, loading ? "読み込み中…" : "このアドバイザリは見つかりませんでした（古くなって削除された可能性があります）"));
  markRead([uid]);
  const v = vinfo(a.vendor), s = sevOf(a);
  const mine = MINE[uid] || { s: "未確認", m: "" };
  const srcName = { vendor: "ベンダー発表", page: "アドバイザリページから抽出", nvd: "NVD" }[a.cvss_source] || "";

  const saveMine = () => { MINE[uid] = { ...mine, t: new Date().toISOString() }; store.set("mine", MINE); };
  const seg = el("div", { class: "seg" });
  const paint = () => seg.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.textContent === mine.s));
  for (const st of STATUSES) seg.append(el("button", { onclick: () => { mine.s = st; paint(); saveMine(); toast("状態: " + st); } }, st));
  paint();
  let mt;
  const memo = el("textarea", { placeholder: "メモ（対象機器、対応予定など）。この端末にだけ保存されます",
    oninput: (e) => { mine.m = e.target.value; clearTimeout(mt); mt = setTimeout(() => { saveMine(); toast("メモを保存しました"); }, 700); } });
  memo.value = mine.m || "";

  const ja = jaSummary(a);
  let showOrig = !ja;
  const sumBody = el("p", {});
  const sumHead = el("h3", {}, "");
  const toggle = el("button", { class: "lnk", onclick: () => { showOrig = !showOrig; paintSum(); } });
  const paintSum = () => {
    sumHead.textContent = showOrig ? "概要（原文）" : "概要（日本語訳）";
    sumBody.textContent = showOrig ? (a.summary || "フィードに概要がありません。「原文を開く」で確認してください。") : ja;
    toggle.textContent = showOrig ? "日本語訳を表示" : "原文を表示";
    toggle.style.display = ja ? "" : "none";
  };
  paintSum();
  const infoCard = el("div", { class: "card" },
    el("div", { class: "item" }, el("div", { class: "trbar" }, sumHead, toggle), sumBody,
      a.ja ? el("div", { class: "trnote" }, `機械翻訳（${ENGINE[a.ja.engine] || a.ja.engine}）です。製品名やバージョンは原文で確認してください。`) : null),
    section("公開日", fullDate(dateOf(a)) + (a.updated && a.updated.slice(0, 10) !== dateOf(a).slice(0, 10) ? `（更新 ${fullDate(a.updated)}）` : "")));

  const url = safeUrl(a.url);
  return el("div", {},
    topbar(v.name, a.adv_id, { backBtn: true }),
    el("div", { class: "dt" },
      el("div", { class: "dhead" }, avatar(v), el("div", {}, el("div", { class: "who" }, v.name), el("div", { class: "id" }, `${a.adv_id} ・ ${fullDate(dateOf(a))}`))),
      el("div", { class: "dtitle" }, headline(a)),
      a.ja && a.ja.title && a.ja.title !== a.title ? el("div", { class: "orig" }, a.title) : null,
      el("div", { class: "score" },
        el("div", { class: "sbox p-" + s }, a.cvss != null ? Number(a.cvss).toFixed(1) : "–", el("small", {}, s || "N/A")),
        el("div", { class: "sinfo" },
          el("div", {}, el("b", {}, a.cvss != null ? `CVSS ${a.cvss_version ? "v" + a.cvss_version : ""}` : "CVSS 未発表"), srcName ? `（${srcName}）` : ""),
          a.kev ? el("div", {}, el("span", { class: "kev" }, "CISA KEV 掲載"), ` 実際の悪用を確認${a.kev_date ? "（" + a.kev_date + "）" : ""}`) : null,
          a.cvss_vector ? el("div", { style: "word-break:break-all;font-size:11px" }, a.cvss_vector) : null)),
      infoCard,
      url ? el("a", { class: "btn", href: url, target: "_blank", rel: "noopener" }, "原文を開く") : null,
      url ? el("a", { class: "btn sub", href: gtUrl(url), target: "_blank", rel: "noopener" }, "原文をGoogle翻訳で開く（全文）") : null,
      (a.cves || []).length ? el("div", { class: "card" }, el("div", { class: "item" }, el("h3", {}, "CVE"),
        el("div", { class: "cves" }, a.cves.map(c => el("a", { href: "https://nvd.nist.gov/vuln/detail/" + encodeURIComponent(c), target: "_blank", rel: "noopener" }, c))))) : null,
      el("div", { class: "card" }, el("div", { class: "item" }, el("h3", {}, "自分の対応状況"), seg, memo))));
}

function viewSettings() {
  const runs = DATA.runs || [];
  const fileIn = el("input", { type: "file", accept: "application/json", style: "display:none", onchange: async (e) => {
    try {
      const j = JSON.parse(await e.target.files[0].text());
      if (j.mine) { MINE = { ...MINE, ...j.mine }; store.set("mine", MINE); }
      if (j.read) { READ = { ...READ, ...j.read }; store.set("read", READ); }
      toast("読み込みました"); render();
    } catch (_) { toast("読み込めませんでした"); }
  } });
  return el("div", {},
    topbar("設定", "", { backBtn: true }),
    el("div", { class: "set" },
      el("div", { class: "card" }, el("h2", {}, "データの状況"),
        el("p", {}, `最終更新: ${DATA.generated ? fullDate(DATA.generated) + " " + shortDate(DATA.generated) : "-"}`),
        el("p", {}, `${DATA.advisories.length}件（日本語訳あり ${DATA.advisories.filter(a => a.ja).length}件）`),
        runs.map(r => el("div", { class: "src" }, el("span", {}, vinfo(r.vendor).name), el("span", {}, r.ok ? `✅ ${r.count}件` : "❌ 取得失敗")))),
      el("div", { class: "card" }, el("h2", {}, "通知"),
        el("p", {}, "通知は ntfy アプリから届きます。通知をタップすると、このアプリの詳細画面が開きます。"),
        el("p", {}, "通知の条件（CVSSのしきい値、製品名）は GitHub の Variables で変更できます。")),
      el("div", { class: "card" }, el("h2", {}, "ほかのアプリ"),
        el("a", { class: "btn sub", href: "../fw/" }, "FW・EOLウォッチ（ファームウェア・サポート終了）を開く")),
      el("div", { class: "card" }, el("h2", {}, "バックアップ"),
        el("p", {}, "対応状況とメモはこの端末にだけ保存されています。機種変更やブラウザのデータ削除の前に書き出してください。"),
        el("div", { class: "row" },
          el("button", { class: "btn sub", onclick: () => {
            const blob = new Blob([JSON.stringify({ mine: MINE, read: READ, at: new Date().toISOString() })], { type: "application/json" });
            const u = URL.createObjectURL(blob); const x = el("a", { href: u, download: "secwatch-backup.json" }); document.body.append(x); x.click(); x.remove();
            setTimeout(() => URL.revokeObjectURL(u), 1000);
          } }, "書き出す"),
          el("button", { class: "btn sub", onclick: () => fileIn.click() }, "読み込む"), fileIn)),
      el("div", { class: "card" }, el("h2", {}, "既読"),
        el("button", { class: "btn sub", onclick: () => { markRead(DATA.advisories.map(a => a.uid)); toast("すべて既読にしました"); } }, "すべて既読にする"))));
}

function render() {
  const r = route();
  if (r.name !== "c") chFilter = "all";  // チャンネルを出たら絞り込みを戻す
  const view = r.name === "c" ? viewChannel(r.arg) : r.name === "a" ? viewDetail(r.arg) : r.name === "settings" ? viewSettings() : viewHome();
  $("#app").replaceChildren(view);
}

document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(false); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
render();
load(false);
</script>
</body>
</html>
