name: collect

on:
  schedule:
    - cron: "7,37 * * * *"   # 30分ごと（GitHub の混雑で数分〜十数分遅れることがあります）
  workflow_dispatch:
    inputs:
      notify_initial:
        description: "初回でも通知する（テスト用）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 翻訳エンジン（Argos Translate）と英日モデルを使い回して、毎回のダウンロードを省く
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.local/share/argos-translate
            ~/.local/cache/argos-translate
          key: argos-${{ runner.os }}-v1

      - name: Collect, translate and notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_MENTION: ${{ secrets.DISCORD_MENTION }}
          DISCORD_MIN_CVSS: ${{ vars.DISCORD_MIN_CVSS }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          TRANSLATE_DISABLE: ${{ vars.TRANSLATE_DISABLE }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          APP_URL: ${{ vars.APP_URL }}
          NOTIFY_MIN_CVSS: ${{ vars.NOTIFY_MIN_CVSS }}
          NOTIFY_KEYWORDS: ${{ secrets.NOTIFY_KEYWORDS }}
          NOTIFY_EXCLUDE: ${{ vars.NOTIFY_EXCLUDE }}
          NOTIFY_VENDORS: ${{ vars.NOTIFY_VENDORS }}
          NOTIFY_INITIAL: ${{ inputs.notify_initial && '1' || '' }}
        run: python collector/run.py

      - name: Commit data
        run: |
          git config user.name "secwatch-bot"
          git config user.email "secwatch-bot@users.noreply.github.com"
          git add docs/data state
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
